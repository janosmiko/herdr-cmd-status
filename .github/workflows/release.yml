name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go.mod holds the oldest Go that builds from source. Releases use a supported one.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # scripts/install.sh downloads the release named after the manifest version.
      - name: Check that the tag matches the manifest version
        run: grep -qFx "version = \"${GITHUB_REF_NAME#v}\"" herdr-plugin.toml
      - run: go test -race ./...
      - name: Build
        run: |
          mkdir dist
          for os in darwin linux; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/herdr-cmd-status-$os-$arch" .
            done
          done
          cd dist && sha256sum herdr-cmd-status-* > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
